[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osmind"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PyGithub>=2.3.0",
    "PyYAML>=6.0",
]

[project.scripts]
osmind = "osmind.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-mock>=3.12"]
